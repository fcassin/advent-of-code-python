[project]
name = "advent-of-code-python"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pypng",
    "z3-solver",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Listed explicitly: flat-layout auto-discovery trips over the year directories.
[tool.setuptools]
packages = ["aoc"]

[tool.basedpyright]
pythonVersion = "3.14"
venvPath = "."
venv = "venv"

# AoC code is throwaway and untyped; "recommended" flags every missing
# annotation. "standard" keeps real errors without the noise.
typeCheckingMode = "standard"

exclude = ["venv", "**/__pycache__"]

[tool.ruff]
exclude = ["venv"]
